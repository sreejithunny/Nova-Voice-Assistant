<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Voice Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Animate CSS -->
    <link rel="stylesheet" href="assets/vendore/texllate/animate.css">
    <link rel="stylesheet" href="style.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #05050a;
            color: #fff;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding: 16px 12px 24px 12px;
            box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .badge-wake {
            font-size: 0.75rem;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #00d2ff;
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
        }

        .center-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            position: relative;
        }

        #siri-container {
            width: 100%;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .siri-message {
            font-size: 1.15rem;
            text-align: center;
            min-height: 48px;
            color: #d1e8ff;
            margin-bottom: 12px;
            padding: 0 16px;
        }

        .bottom-controls {
            width: 100%;
            padding-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <!-- Top Status Bar -->
        <div class="header-bar">
            <h1 class="brand-title">NOVA</h1>
            <div id="WakeWordToggle" class="badge-wake">
                <i class="bi bi-broadcast"></i> Wake: "Nova"
            </div>
        </div>

        <!-- Center Interactive Stage -->
        <div class="center-stage">
            <section id="Oval">
                <div class="d-flex flex-column justify-content-center align-items-center">
                    <div id="AVAHood" class="mb-4">
                        <div class="square">
                            <span class="circle"></span>
                            <span class="circle"></span>
                            <span class="circle"></span>
                        </div>
                    </div>
                    <h5 id="StatusText" class="text-light text-center" style="font-weight: 300; font-size: 1rem; opacity: 0.85;">
                        Say "Nova" or tap the mic
                    </h5>
                </div>
            </section>

            <section id="SiriWave" hidden style="width: 100%;">
                <div class="d-flex flex-column justify-content-center align-items-center">
                    <p id="SiriMessageText" class="siri-message">Listening to you...</p>
                    <div id="siri-container"></div>
                </div>
            </section>
        </div>

        <!-- Bottom Input & Controls -->
        <div class="bottom-controls">
            <div id="TextInput" class="d-flex align-items-center">
                <input type="text" class="input-field" name="chatbox" id="chatbox" placeholder="Ask Nova anything...">
                <button id="SendBtn" class="glow-on-hover" hidden><i class="bi bi-send"></i></button>
                <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                <button id="ChatBtn" class="glow-on-hover" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling"><i class="bi bi-chat-dots"></i></button>
            </div>
        </div>
    </div>

    <!-- Side Chat History Drawer -->
    <div class="offcanvas offcanvas-start chat-canvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasScrolling">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-white">Nova Conversation</h5>
            <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas"></button>
        </div>
        <div id="chat-canvas-body" class="offcanvas-body">
            <div class="row justify-content-start mb-4">
                <div class="width-size">
                    <div class="receiver_message">Hello! I am Nova, your personal assistant. How can I help you today?</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
    <script src="controller.js"></script>
    <script src="main.js"></script>
</body>

</html>
